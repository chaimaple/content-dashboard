: "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "类型：评测案例\n\n出处：周报评测\nhttps://analyst.ai/reviews/ai-growth-report-tools/\n\n案例/事实：ChatGPT 把北美的地区代码 NA 当成“无数据”，6到7月超过36万美元的北美销售被漏掉，失败支付题又犯了一次；Julius 也把10,745名客户当成“无地区”\n\n封面：监控截图，表格里 NA 被红框圈住，旁边“= 无数据？”，世界地图北美打问号\n\n切入角度：第一人称：我盯着报表半天才反应过来，AI不是算错了，是把北美的代码 NA 读成了“无数据”。｜现象：缩写陷阱，AI的错常出在“读进去”那一步而不是“算”那一步。结尾实用建议：发报告前先看AI读进去的前几行。\n\n发布前核实：• 保安号点名吐槽具体产品，只用评测里的原句和数字，每篇结尾补一句公允评价，避免被认为是抹黑。", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z", "cover": "img/cover/6ae85830000000000502c9c8.jpg"}, {"id": "p1102-13", "sec": "xhs1", "title": "通用AI大于专业工具？", "type": "图文", "duration": "", "time": "12:39", "status": "published", "date": "2026-11-03", "link": "https://www.xiaohongshu.com/explore/6ae96594000000001100c71b?xsec_token=ABJ58EqXfbW7ijqAs3Rs3HRCzGk6wYfROBIPq_J7gRMP4=&xsec_source=pc_user", "m": {"likes": 4, "saves": 4, "comments": 0, "shares": 0}, "mAt": "2026-11-10T05:54:55.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "类型：宝藏工具\n\n出处：销售邮件评测\nhttps://analyst.ai/reviews/ai-sales-email-tools/\n\n案例/事实：全检通过 ChatGPT 10/24、Clay 1/12、Lavender 0/12；提到客户近况的 ChatGPT 24/24、Clay 4/12、Lavender 0/12\n\n封面：专栏风，大鱼吃小鱼简图，三个真实 logo，大字同标题\n\n切入角度：第一人称：做产品的我一直信“专用打败通用”，这次销售邮件实测让我动摇了。｜认知：专用工具的价值要从“写得更好”转向数据和流程；写明样本只有6家虚构公司。\n\n发布前核实：• 销售邮件：“正文不能有给审核看的提示”这条规则是测完才加的，去掉这条 ChatGPT 是14/24；Lavender 是通过 Boost Score 测的。保安号吐槽时要带上这些条件。", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z", "cover": "img/cover/6ae96594000000001100c71b.jpg"}, {"id": "p1102-15", "sec": "amvkj3buu8p7j", "title": "5个AI排行榜网站，建议收藏", "type": "图文", "duration": "", "status": "published", "date": "2026-11-04", "time": "17:44", "link": "https://www.xiaohongshu.com/explore/6aeafe7b000000001a014e0e?xsec_token=AB3GB7HVgQxniH9oxmYYbVQM-avrqPlP_SPVX3INc1ais=&xsec_source=pc_user", "m": {"likes": 6, "saves": 8, "comments": 0, "shares": 0}, "mAt": "2026-11-10T05:54:55.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "原排期选题：「AI的聪明程度，居然每天都在变」\n类型：AI网站\n\n出处：analyst.ai/models「每日模型监控」（Beta）\nhttps://analyst.ai/models/\n\n案例/事实：每天给模型打总分和6项能力分，并和24小时、7天均值比；11月1日 Opus 5.5 High 76.3、Astra 6 High 76.2\n\n封面：课程表样式“今日AI状态”，带上下箭头，不突出具体分数\n\n切入角度：第一人称：我以为一个AI有多聪明是固定的，结果有网站每天给它们打分，还和昨天、上周比。｜认知：AI不是买断的能力，而是每天浮动的“状态”；分数发布当天重新截图。\n\n发布前核实：• 日榜（/models）的分数每天都变，周三那篇要在发布当天重新截图、改数字。", "cover": "img/cover/6aeafe7b000000001a014e0e.jpg", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z"}, {"id": "p1102-16", "sec": "xhs1", "title": "最近AI模型多得让人挑花了眼。", "type": "图文", "duration": "", "status": "published", "date": "2026-11-04", "time": "17:46", "link": "https://www.xiaohongshu.com/explore/6aeaff03000000001a028183?xsec_token=AB3GB7HVgQxniH9oxmYYbVQGzKA_G_KY3JnTFP4cLLAw8=&xsec_source=pc_user", "m": {"likes": 4, "saves": 4, "comments": 0, "shares": 0}, "mAt": "2026-11-10T05:54:55.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "原排期选题：「AI理财最大的坑，是它只说一半」\n类型：评测案例\n\n出处：家庭理财评测\nhttps://analyst.ai/reviews/ai-assistant-household-money/\n\n案例/事实：72题，dots 84.7（61/72），Grok Bot 76.4，Instinct 和 Muse 都是73.6；约300个必需数字里答对279到290个，但约四分之一的回答漏了数字、条件或来源；后三名只差2.8分，可能互换\n\n封面：专栏风，一张账单被遮住一半，大字同标题\n\n切入角度：第一人称：AI给的数字我核了大多是对的，但约四分之一的回答漏了条件或来源。｜认知：理财场景里“不完整”比“错”更危险，因为你不知道缺了什么；写明不构成理财建议。\n\n发布前核实：• 家庭理财、搜索、投资三篇评测都写明后面会加“一周盯盘”部分，分数可能变，发布前回原文看一眼更新记录。\n• 涉及投资理财的笔记保留“不构成投资建议”。\n• Muse、Instinct 的开发方和官网未核实：不写“Muse来自Meta”“独立创业公司”，不放 muse.ai / instinct.com 链接。", "cover": "img/cover/6aeaff03000000001a028183.jpg", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z"}, {"id": "p1102-17", "sec": "xhs2", "title": "AI时代，这5个海外榜单建议收藏", "type": "图文", "duration": "", "status": "published", "date": "2026-11-04", "time": "17:52", "link": "https://www.xiaohongshu.com/explore/6aeb00690000000016006dfa?xsec_token=ABgtdhi-TwnvhTWR4dINi-b3jA9BSWm-dS6KpGX6U8ea0=&xsec_source=pc_user", "m": {"likes": 4, "saves": 4, "comments": 0, "shares": 0}, "mAt": "2026-11-10T05:54:55.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "原排期选题：「AI盖了“已验证”章，我反而慌了」\n类型：评测案例\n\n出处：周报评测\nhttps://analyst.ai/reviews/ai-growth-report-tools/\n\n案例/事实：Quadratic 在 Excel 跑法中漏掉合同到期损失的收入，报0，还宣称收入桥“verified”；两种跑法都把取消和支付失败的订单算进收入，1月多算超过3.6万美元\n\n封面：绿色 verified 印章被红笔打叉，监控时间戳\n\n切入角度：第一人称：报告里AI自己写着 verified，回头一查收入少算了一项、取消的订单还算进了收入。｜现象：AI的自我认证，verified 是它说的，不是你查的。结尾公允补一句。\n\n发布前核实：• 保安号点名吐槽具体产品，只用评测里的原句和数字，每篇结尾补一句公允评价，避免被认为是抹黑。", "cover": "img/cover/6aeb00690000000016006dfa.jpg", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z"}, {"id": "p1102-19", "sec": "xhs1", "title": "最近很火的个人AI助手，到底是什么？", "type": "图文", "duration": "", "status": "published", "date": "2026-11-05", "time": "16:34", "link": "https://www.xiaohongshu.com/explore/6aec3f7f000000000f025af2?xsec_token=ABMtOy4evgOfg0zwBwKjDmHurFDOc9uzPo8Qttrh94EgQ=&xsec_source=pc_user", "m": {"likes": 2, "saves": 2, "comments": 0, "shares": 0}, "mAt": "2026-11-10T05:54:55.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-10T05:54:55.000Z"}, "notes": "原排期选题：「AI工具最值钱的，往往不是主打功能」\n类型：宝藏工具\n\n出处：销售邮件评测\nhttps://analyst.ai/reviews/ai-sales-email-tools/\n\n案例/事实：Clay 6家公司研究全对，可追溯三项全满足，18个任务用18个积分全部有记录；但邮件仅 1/12 通过，9/12 含资料里没有的自夸\n\n封面：Clay 真实 logo，划掉“写信”，红圈圈出“查资料”\n\n切入角度：第一人称：我原以为Clay是写信工具，实测里它写信几乎不过关，研究和可追溯记录却全对。｜认知：选AI工具要看它真正可靠的环节，而不是宣传最响的卖点。\n\n发布前核实：• 销售邮件：“正文不能有给审核看的提示”这条规则是测完才加的，去掉这条 ChatGPT 是14/24；Lavender 是通过 Boost Score 测的。保安号吐槽时要带上这些条件。", "cover": "img/cover/6aec3f7f000000000f025af2.jpg", "createdAt": "2026-11-02T07:04:08.000Z", "updatedAt": "2026-11-10T05:54:55.000Z"}, {"id": "p1102-20", "sec": "xhs2", "title": "涨知识啦🤔", "type": "图文", "duration": "", "status": "published", "date": "2026-11-05", "time": "16:39", "link": "https://www.xiaohongshu.com/explore/6aec40ad000000001f017524?xsec_token=ABMtO nts": 0, "shares": 0, "views": 10}, "mAt": "2026-11-11T05:57:49.000Z", "mSrc": "claude", "sync": {"state": "ok", "note": "", "at": "2026-11-11T05:57:49.000Z"}, "updatedAt": "2026-11-11T05:57:49.000Z"}], "updatedAt": "2026-11-12T09:00:00.000Z", "skills": [{"id": "s-wechat-article", "name": "公众号文章写作全流程", "desc": "给一个海外评测或产品实测链接，产出适合微信搜一搜的公众号文章：资料核验、选角度、标题、正文、配图封面、Word 交付、存草稿箱，附一篇通过检查的范文。", "status": "live", "date": "2026-11-02", "link": "", "tags": "公众号, 写作, 硅基游民罗伊", "notes": "包含 SKILL.md 和 3 份参考：范文 PR04、卡兹克 10 篇语料笔记、账号案例教训。", "createdAt": "2026-11-02T05:25:02.000Z", "updatedAt": "2026-11-02T05:25:02.000Z"}, {"id": "s-xhs-kid", "name": "小红书运营 · 小学生讲AI", "desc": "站在第一次认真用 AI 的普通人角度，读完要学会一个概念或习惯。AI 是会考试、会粗心、会进步的「同学」，要学会检查它的作业；analyst.ai 是给 AI 出卷子判卷的「阅卷老师」，可以单独做网站篇。小学生口吻，作业本红笔批改风封面。", "status": "live", "date": "2026-11-02", "link": "", "tags": "小红书, 小学生讲AI, 工具合集, 科普", "notes": "Skill：xhs-xiaoxuesheng-ai。11 月 4 日重写：每个号各有自己的读者、看 AI 的角度、对待 analyst.ai 的角度、选题自检问题和三号拆分对照表；话题、字数、数据核对、ChatGPT 和创作页操作、等用户回复「发」才发布等通用规则每个 Skill 里各有一份。", "createdAt": "2026-11-02T05:26:37.000Z", "updatedAt": "2026-11-04T01:24:47.000Z"}, {"id": "s-xhs-guard", "name": "小红书运营 · 硅谷保安室", "desc": "站在天天用 AI 干活、被坑过的打工人角度，读完能认出一个坑。AI 是看着靠谱、要盯着的「新同事」，专讲翻车现场并给坑起名；analyst.ai 是回放 AI 干活全过程的「监控录像」，只作为证据出场，不单独做网站篇。结尾公允补一句，600 到 800 字。", "status": "live", "date": "2026-11-02", "link": "", "tags": "小红书, 硅谷保安室, 翻车故事", "notes": "Skill：xhs-guigu-baoanshi。11 月 4 日重写：每个号各有自己的读者、看 AI 的角度、对待 analyst.ai 的角度、选题自检问题和三号拆分对照表；话题、字数、数据核对、ChatGPT 和创作页操作、等用户回复「发」才发布等通用规则每个 Skill 里各有一份。", "createdAt": "2026-11-02T05:26:37.000Z", "updatedAt": "2026-11-04T01:24:47.000Z"}, {"id": "s-xhs-pm", "name": "小红书运营 · AI产品经理阿策", "desc": "站在要花钱选工具、带团队的决策者角度，读完得到一个判断。AI 是要看值不值的「产品」：通用和专用、定价、定位、趋势；analyst.ai 是「独立第三方测评机构」，既讲它为什么可信（不收赞助、评分表可下载、更正带日期），也讲样本小、公司虚构等局限。专栏风封面。", "status": "live", "date": "2026-11-02", "link": "", "tags": "小红书, AI产品经理阿策, 行业判断", "notes": "Skill：xhs-ai-pm-ace。11 月 4 日重写：每个号各有自己的读者、看 AI 的角度、对待 analyst.ai 的角度、选题自检问题和三号拆分对照表；话题、字数 async function commit(mutate, msg) {
  if (!art || !canWrite) { toast("你只有查看权限"); return false; }
  const next = JSON.parse(JSON.stringify(state));
  if (mutate(next) === false) return false;
  next.updatedAt = new Date().toISOString();
  try { sessionStorage.setItem("cd-toast", msg || "已保存"); } catch (e) {}
  const ov = document.createElement("div"); ov.className = "saving"; ov.textContent = "正在保存…"; document.body.appendChild(ov);
  try { await art.publish(buildHtml(next)); return true; }
  catch (e) {
    ov.remove(); try { sessionStorage.removeItem("cd-toast"); } catch (err) {}
    const code = e?.code;
    if (code === "conflict") { toast("页面刚被更新过，正在刷新"); return false; }
    if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(code)) { canWrite = false; render(); toast("你只有查看权限"); return false; }
    toast(code === "rate_limited" ? "保存太频繁，稍等几秒再试" : code === "too_large" ? "内容太多，存不下了" : "保存失败，请稍后再试");
    return false;
  }
}

       <div class="field"><label for="e-sec">发在哪个账号</label><select id="e-sec">${opts}</select></div>
       <div class="field"><label for="e-type">形式</label><select id="e-type">${P.types.map(t => `<option ${t === it.type ? "selected" : ""}>${t}</option>`).join("")}</select></div>
       <div class="field" id="dur-field" ${it.type === "视频" ? "" : "hidden"}><label for="e-dur">视频时长</label><input id="e-dur" value="${esc(it.duration || "")}" placeholder="如 3:25"></div>
       <div class="field"><label for="e-status">状态</label><select id="e-status">${STATUS.map(([k, n]) => `<option value="${k}" ${k === it.status ? "selected" : ""}>${n}</option>`).join("")}</select></div>
       <div class="field"><label for="e-date" id="e-date-l">${it.status === "published" ? "发布日期" : "计划发布日期"}</label><input id="e-date" type="date" value="${esc(it.date || "")}"></div>
       <div class="field"><label for="e-time">发布时间</label><input id="e-time" type="time" value="${esc(it.time || "")}"></div>
     </div>
     <div class="field"><label for="e-link">链接</label><input id="e-link" value="${esc(it.link || "")}" placeholder="发布后填，https://…"></div>
     <div class="field"><label>数据${it.mAt ? `（${it.mSrc === "claude" ? "Claude 读取于" : "更新于"} ${fmtTime(it.mAt)}）` : ""}</label>
       <div class="mgrid">${MK.map((k, i) => `<div class="field"><label for="e-m-${k}">${P.m[i]}</label><input id="e-m-${k}" inputmode="decimal" value="${it.m?.[k] ?? ""}" placeholder="—"></div>`).join("")}</div></div>
     <div class="field"><label for="e-notes">备注</label><textarea id="e-notes" placeholder="脚本要点、封面想法、复盘…">${esc(it.notes || "")}</textarea></div>`,
    saveBtns(isNew ? "创建" : "保存"), `data-id="${esc(id || "")}" data-plat="${platOf(it.sec)}"`, false);
  setTimeout(() => document.getElementById("e-title")?.focus(), 30);
}
function openSkill(id) {
  const s = id ? skillById(id) : { status: "dev", date: today() };
  if (!s) return;
  modal("sf", id ? "编辑 Skill" : "添加 Skill",
    `<div class="field"><label for="s-name">名称</label><input id="s-name" value="${esc(s.name || "")}" placeholder="比如：小红书选题生成"></div>
     <div class="field"><label for="s-desc">一句话说明</label><textarea id="s-desc" style="min-height:48px" placeholder="它能做什么">${esc(s.desc || "")}</textarea></div>
     <div class="grid2">
       <div class="field"><label for="s-status">状态</label><select id="s-status">${SK_STATUS.map(([k, n]) => `<option value="${k}" ${k === s.status ? "selected" : ""}>${n}</option>`).join("")}</select></div>
       <div class="field"><label for="s-date">日期</label><input id="s-date" type="date" value="${esc(s.date || "")}"></div>
     </div>
     <div class="field"><label for="s-link">链接</label><input id="s-link" value="${esc(s.link || "")}" placeholder="文档、仓库或演示地址"></div>
     <div class="field"><label for="s-tags">标签</label><input id="s-tags" value="${esc(s.tags || "")}" placeholder="用逗号隔开，如：小红书, 选题"></div>
     <div class="field"><label for="s-notes">备注</label><textarea id="s-notes">${esc(s.notes || "")}</textarea></div>`,
    saveBtns(id ? "保存" : "添加"), `data-sid="${esc(id || "")}"`);
  setTimeout(() => document.getElementById("s-name")?.focus(), 30);
}
function openAddAcct(plat) {
  modal("af", "添加账号",
    `<div class="field"><label for="a-plat">平台</label><select id="a-plat">${PLAT_ORDER.map(k => `<option value="${k}" ${k === plat ? "selected" : ""}>${PLAT[k].name}</option>`).join("")}</select></div>
     <div class="field"><label for="a-name">账号名称</label><input id="a-name" placeholder="比如：阿柴有问题"></div>`,
    saveBtns("添加"), `data-plat="${plat}"`);
  setTimeout(() => document.getElementById("a-name")?.focus(), 30);
}
function openRename(sec) {
  const a = acct(sec); if (!a) return;
  const n = itemsOf(sec).length;
  modal("rf", `${PLAT[a.plat].name}账号`,
    `<div class="field"><label for="r-name">账号名称</label><input id="r-name" value="${esc(a.name)}"></div>
     ${n ? `<div class="hint">这个账号下有 ${n} 条内容。要删除账号，先把内容删掉，或在「编辑内容」里移到别的账号。</div>` : ""}`,
    `${n ? "" : `<button class="btn danger" type="button" data-act="delacct">删除账号</button>`}${saveBtns("保存")}`,
    `data-sec="${esc(sec)}" data-plat="${a.plat}"`);
  setTimeout(() => document.getElementById("r-name")?.select(), 30);
}

/* ---------- 事件 ---------- */
document.addEventListener("contextmenu", e => {
  const sk = e.target.closest("[data-skill]");
  if (sk) { const s = skillById(sk.dataset.skill); if (!canWrite && !safeUrl(s?.link)) return; e.preventDefault(); openSkillCtx(sk.dataset.skill, e.clientX, e.clientY); return; }
  const c = e.target.closest("[data-card]");
  if (c) { const it = itemById(c.dataset.card); if (!canWrite && !safeUrl(it?.link)) return; e.preventDefault(); openCtx(c.dataset.card, e.clientX, e.clientY); return; }
  const h = e.target.closest("[data-acct]");
  if (h && canWrite) { e.preventDefault(); openRename(h.dataset.acct); }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a, [data-close-bg]");
  if (ui.ctx && !e.target.closest(".ctx")) { closeLayer(); if (!t || t.closest(".ctx")) return; }
  if (!t) return;
  if (t.matches("[data-close-bg]")) { if (e.target === t) closeLayer(); return; }
  if (t.dataset.close !== undefined) return closeLayer();
  if (t.dataset.view) { ui.view = t.dataset.view; remember("view", ui.view); return render(); }
  if (t.dataset.pf) { ui.plat = t.dataset.pf; remember("tab", ui.plat); return render(); }
  if (t.dataset.week !== undefined) { ui.week = t.dataset.week === "0" ? 0 : ui.week + Number(t.dataset.week); return render(); }
  if (t.dataset.plan !== undefined) return canWrite && openEdit(null, null, t.dataset.plan);
  if (t.dataset.newskill !== undefined) return canWrite && openSkill(null);
  if (t.dataset.sedit) return openSkill(t.dataset.sedit);
  if (t.dataset.smore) { const r = t.getBoundingClientRect(); return openSkillCtx(t.dataset.smore, r.right - 190, r.bottom + 4); }
  if (t.dataset.more) { const r = t.getBoundingClientRect(); return openCtx(t.dataset.more, r.right - 190, r.bottom + 4); }
  if (t.dataset.new) return canWrite && openQuick(t.dataset.new);
  if (t.dataset.full) return openEdit(null, t.dataset.full);
  if (t.dataset.rename) return openRename(t.dataset.rename);
  if (t.dataset.addacct) return openAddAcct(t.dataset.addacct);
  const act = t.dataset.act; if (!act) return;
  const id = t.dataset.id || t.closest(".ctx")?.dataset.id || t.closest("form")?.dataset.id;
  const sid = t.closest(".ctx")?.dataset.sid;
  const it = itemById(id);
  if (act === "open") { setTimeout(closeLayer, 0); return; }
  if (act === "copy" || act === "scopy") { const u = (act === "copy" ? it?.link : skillById(sid)?.link) || ""; closeLayer(); try { await navigator.clipboard.writeText(u); toast("链接已复制"); } catch (err) { toast("复制失败：" + u); } return; }
  if (act === "link") return canWrite && openLink(id);
  if (act === "edit") return openEdit(id);
  if (act === "sedit") return openSkill(sid);
  if (act === "status") {
    const st = t.dataset.st; closeLayer();
    return commit(s => { const x = s.items.find(i => i.id === id); if (!x) return false; if (st === "published" && x.status !== "published" && !x.date) x.date = today(); x.status = st; x.updatedAt = new Date().toISOString(); }, `已改为「${SNAME[st]}」`);
  }
  if (act === "sstatus") {
    const st = t.dataset.st; closeLayer();
    return commit(s => { const x = s.skills.find(i => i.id === sid); if (!x) return false; x.status = st; x.updatedAt = new Date().toISOString(); }, `已改为「${SKNAME[st]}」`);
  }
  if (act === "del" || act === "sdel") {
    if (!ui.confirmDel) { ui.confirmDel = true; t.textContent = "再点一次，确认删除"; return; }
    closeLayer();
    return act === "del" ? commit(s => { s.items = s.items.filter(i => i.id !== id); }, "已删除") : commit(s => { s.skills = (s.skills || []).filter(i => i.id !== sid); }, "已删除");
  }
  if (act === "unlink") { closeLayer(); return commit(s => { const x = s.items.find(i => i.id === id); if (x) { x.link = ""; x.sync = { state: "" }; } }, "链接已移除"); }
  if (act === "delacct") {
    const sec = t.closest("form")?.dataset.sec;
    if (itemsOf(sec).length) { toast("这个账号下还有内容，先移走或删除"); return; }
    if (!ui.confirmDel) { ui.confirmDel = true; t.textContent = "再点一次，确认删除"; return; }
    closeLayer(); return commit(s => { s.accounts = s.accounts.filter(a => a.id !== sec); }, "账号已删除");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.ctx || ui.modal)) closeLayer(); });
addEventListener("scroll", () => { if (ui.ctx) closeLayer(); }, { passive: true });
addEventListener("resize", () => { if (ui.ctx) closeLayer(); });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, now = new Date().toISOString();
  if (f.id === "lf") {
    const raw = document.getElementById("lf-url").value, u = normUrl(extractUrl(raw)), id = f.dataset.id;
    if (raw.trim() && !u) { toast("没认出网址，检查一下链接"); return; }
    closeLayer();
    return commit(s => { const x = s.items.find(i => i.id === id); if (!x) return false; if (u !== x.link) { x.link = u; x.sync = u ? { state: "pending", note: "", at: now } : { state: "" }; } x.updatedAt = now; }, u ? "链接已保存，等 Claude 读取" : "链接已移除");
  }
  if (f.id === "qf") {
    const u = normUrl(extractUrl(document.getElementById("q-url").value)), sec = f.dataset.sec;
    if (!u) { toast("没认出网址，检查一下链接"); return; }
    closeLayer();
    return commit(s => { s.items.push({ id: newId("i"), sec, title: "", type: PLAT[platOf(sec)].types[0], duration: "", status: "published", date: "", link: u, m: {}, mAt: "", mSrc: "", sync: { state: "pending", note: "", at: now }, notes: "", createdAt: now, updatedAt: now }); }, "已添加，等 Claude 读取标题和数据");
  }
  if (f.id === "ef") {
    const id = f.dataset.id, prev = id ? itemById(id) : null;
    const title = document.getElementById("e-title").value.trim();
    const link = normUrl(extractUrl(document.getElementById("e-link").value));
    if (!title && !link) { toast("填标题，或者填链接让 Claude 读标题"); return; }
    const status = document.getElementById("e-status").value, type = document.getElementById("e-type").value;
    let date = document.getElementById("e-date").value || ""; if (status === "published" && !date) date = today();
    const m = {}; let changed = false;
    MK.forEach(k => { const v = numOrNull(document.getElementById("e-m-" + k).value); if (v != null) m[k] = v; if (v !== (prev?.m?.[k] ?? null)) changed = true; });
    const body = {
      id: id || newId("i"), title, sec: document.getElementById("e-sec").value, type,
      duration: type === "视频" ? normDur(document.getElementById("e-dur").value) : "", status, date, time: document.getElementById("e-time").value || "", link,
      sync: link && link !== prev?.link ? { state: "pending", note: "", at: now } : (prev?.sync || { state: "" }),
      m, mAt: changed ? now : (prev?.mAt || ""), mSrc: changed ? "manual" : (prev?.mSrc || ""),
      notes: document.getElementById("e-notes").value, createdAt: prev?.createdAt || now, updatedAt: now,
    };
    closeLayer();
    return commit(s => { const i = s.items.findIndex(x => x.id === body.id); if (i >= 0) s.items[i] = { cover: s.items[i].cover, ...body }; else s.items.push(body); }, id ? "已保存" : "已加入排期");
  }
  if (f.id === "sf") {
    const sid = f.dataset.sid, prev = sid ? skillById(sid) : null;
    const name = document.getElementById("s-name").value.trim();
    if (!name) { toast("填一下 Skill 名称"); return; }
    const body = {
      id: sid || newId("s"), name, desc: document.getElementById("s-desc").value.trim(),
      status: document.getElementById("s-status").value, date: document.getElementById("s-date").value || "",
      link: normUrl(extractUrl(document.getElementById("s-link").value)), tags: document.getElementById("s-tags").value.trim(),
      notes: document.getElementById("s-notes").value, createdAt: prev?.createdAt || now, updatedAt: now,
    };
    closeLayer();
    return commit(s => { s.skills = Array.isArray(s.skills) ? s.skills : []; const i = s.skills.findIndex(x => x.id === body.id); if (i >= 0) s.skills[i] = { gallery: s.skills[i].gallery, ...body }; else s.skills.push(body); }, sid ? "已保存" : "Skill 已添加");
  }
  if (f.id === "af") {
    const name = document.getElementById("a-name").value.trim(), plat = document.getElementById("a-plat").value;
    if (!name) { toast("填一下账号名称"); return; }
    closeLayer(); return commit(s => { s.accounts.push({ id: newId("a"), plat, name }); }, `已添加${PLAT[plat].name}账号「${name}」`);
  }
  if (f.id === "rf") {
    const name = document.getElementById("r-name").value.trim(), sec = f.dataset.sec;
    if (!name) return;
    closeLayer(); return commit(s => { const a = s.accounts.find(x => x.id === sec); if (!a) return false; a.name = name; }, "已改名");
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "e-sec") {
    const P = PLAT[platOf(e.target.value)], sel = document.getElementById("e-type"), cur = sel.value;
    sel.innerHTML = P.types.map(t => `<option ${t === cur ? "selected" : ""}>${t}</option>`).join("");
    MK.forEach((k, i) => { const l = document.querySelector(`label[for="e-m-${k}"]`); if (l) l.textContent = P.m[i]; });
    document.getElementById("ef").dataset.plat = platOf(e.target.value);
    document.getElementById("dur-field").hidden = sel.value !== "视频";
  }
  if (e.target.id === "e-type") document.getElementById("dur-field").hidden = e.target.value !== "视频";
  if (e.target.id === "e-status") {
    document.getElementById("e-date-l").textContent = e.target.value === "published" ? "发布日期" : "计划发布日期";
    const d = document.getElementById("e-date"); if (e.target.value === "published" && !d.value) d.value = today();
  }
});

/* ---------- 启动 ---------- */
document.body.insertAdjacentHTML("beforeend", '<div id="layer"></div><div class="toast" id="toast" hidden></div>');
render();
try { const msg = sessionStorage.getItem("cd-toast"); if (msg) { sessionStorage.removeItem("cd-toast"); toast(msg); } } catch (e) {}
(async () => {
  try {
    const [a, user] = await Promise.all([window.claude?.use?.("artifact"), window.claude?.use?.("user")]);
    art = a || null;
    const edit = user ? await user.canEdit() : false;
    canWrite = !!(art && edit);
  } catch (e) { canWrite = false; }
  if (canWrite) render();
})();
</script>
